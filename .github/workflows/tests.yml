name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned simulator dependencies
        run: python -s -m pip install -r requirements-lock.txt
      - name: Check installed dependencies
        run: python -s -m pip check
      - name: Verify frozen benchmark
        run: python -s -c "from evaluation.benchmark import verify_frozen; verify_frozen(); print('Frozen benchmark verified')"
      - name: Run tests
        run: python -s -m pytest -q
